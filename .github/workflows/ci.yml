name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    name: Browser lint, typecheck, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack install
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Browser
        run: pnpm ci:verify

  python:
    name: Python backend wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.6
      - name: Install locked backend environment
        run: |
          python -m pip install 'uv==0.10.7'
          uv sync --project services/science --locked --extra dev
      - name: Compile Python sources
        run: uv run --project services/science python -m compileall -q services/science/science_backend
      - name: Build wheel
        run: uv build --project services/science --wheel --out-dir "$RUNNER_TEMP/wheels"
      - name: Install and import built wheel
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install "$RUNNER_TEMP"/wheels/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/python" -c \
            "import science_backend; from importlib.metadata import version; assert science_backend.__version__ == '0.2.0-alpha.1'; assert version('otherlight-science-backend') == '0.2.0a1'"
