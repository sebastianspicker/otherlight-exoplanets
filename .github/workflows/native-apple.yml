name: Native Apple

on:
  pull_request:
    branches: ["main", "dev"]
    paths:
      - ".github/workflows/native-apple.yml"
      - ".github/workflows/native-macos-dmg.yml"
      - "contracts/capabilities-v1/**"
      - "contracts/education-v4/**"
      - "contracts/science-v5/**"
      - "contracts/science-v6/**"
      - "contracts/workspace-v1/**"
      - "apps/apple/**"
      - "scripts/select-swift-toolchain.sh"
      - "apps/browser/src/application/catalog/real-systems.snapshot.json"
  push:
    branches: ["main", "dev"]
    paths:
      - ".github/workflows/native-apple.yml"
      - ".github/workflows/native-macos-dmg.yml"
      - "contracts/capabilities-v1/**"
      - "contracts/education-v4/**"
      - "contracts/science-v5/**"
      - "contracts/science-v6/**"
      - "contracts/workspace-v1/**"
      - "apps/apple/**"
      - "scripts/select-swift-toolchain.sh"
      - "apps/browser/src/application/catalog/real-systems.snapshot.json"
  workflow_dispatch:

concurrency:
  group: native-apple-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift-package-core:
    name: Swift package / portable core
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Toolchain evidence
        run: |
          source scripts/select-swift-toolchain.sh
          env -u TOOLCHAINS xcodebuild -version | grep -Fx "Xcode 26.6"
          swift --version | grep -F "Swift version 6.3.3"
      - name: Test portable Swift package
        run: swift test --package-path apps/apple/Packages/OtherlightCore
      - name: Benchmark interactive, reference, and series workloads
        run: |
          source scripts/select-swift-toolchain.sh
          swift --version > "$RUNNER_TEMP/apple-benchmark.txt"
          swift run --package-path apps/apple/Packages/OtherlightCore OtherlightBenchmark >> "$RUNNER_TEMP/apple-benchmark.txt"
      - name: Upload Apple benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apple-benchmarks
          path: ${{ runner.temp }}/apple-benchmark.txt
          if-no-files-found: warn
      - name: Check Swift formatting
        run: swift format lint --strict --recursive apps/apple

  swift-package-science:
    name: Swift package / macOS science
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Toolchain evidence
        run: |
          source scripts/select-swift-toolchain.sh
          env -u TOOLCHAINS xcodebuild -version | grep -Fx "Xcode 26.6"
          swift --version | grep -F "Swift version 6.3.3"
      - name: Test macOS-only scientific package
        run: swift test --package-path apps/apple/Packages/OtherlightScience

  app-test:
    name: ${{ matrix.destination.name }}
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        destination:
          - name: iPhone 17 Pro / iOS 26.5
            value: "platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5"
          - name: iPad Pro 13-inch (M5) / iOS 26.5
            value: "platform=iOS Simulator,name=iPad Pro 13-inch (M5),OS=26.5"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Toolchain evidence
        run: |
          source scripts/select-swift-toolchain.sh
          env -u TOOLCHAINS xcodebuild -version | grep -Fx "Xcode 26.6"
          swift --version | grep -F "Swift version 6.3.3"
      - name: Test iPhone and iPad Education target
        env:
          OTHERLIGHT_DESTINATION: ${{ matrix.destination.value }}
          OTHERLIGHT_DERIVED_DATA_PATH: ${{ runner.temp }}/Otherlight-${{ strategy.job-index }}
        run: |
          env -u TOOLCHAINS xcodebuild test \
            -project apps/apple/Otherlight.xcodeproj \
            -scheme Otherlight \
            -configuration Debug \
            -destination "$OTHERLIGHT_DESTINATION" \
            -derivedDataPath "$OTHERLIGHT_DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO

  macos-science-host-test:
    name: macOS / OtherlightMac scientific host
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Toolchain evidence
        run: |
          source scripts/select-swift-toolchain.sh
          env -u TOOLCHAINS xcodebuild -version | grep -Fx "Xcode 26.6"
          swift --version | grep -F "Swift version 6.3.3"
      - name: Test macOS-only science host
        run: |
          env -u TOOLCHAINS xcodebuild test \
            -project apps/apple/OtherlightMac.xcodeproj \
            -scheme OtherlightMac \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/OtherlightMac" \
            CODE_SIGNING_ALLOWED=NO

  ios-generic-archive:
    name: Generic iOS archive / unsigned metadata gate
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DERIVED_DATA: ${{ github.workspace }}/.build/Otherlight-iOS-archive
      ARCHIVE_PATH: ${{ github.workspace }}/.build/Otherlight-iOS.xcarchive
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Toolchain evidence
        run: |
          source scripts/select-swift-toolchain.sh
          env -u TOOLCHAINS xcodebuild -version | grep -Fx "Xcode 26.6"
          swift --version | grep -F "Swift version 6.3.3"
      - name: Archive generic iOS app without signing
        run: |
          env -u TOOLCHAINS xcodebuild archive \
            -project apps/apple/Otherlight.xcodeproj \
            -scheme Otherlight \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Verify app metadata, privacy manifest, and mobile dependencies
        run: |
          app="$ARCHIVE_PATH/Products/Applications/Otherlight.app"
          test -d "$app"
          test -f "$app/Info.plist"
          test -f "$app/PrivacyInfo.xcprivacy"
          plutil -lint "$app/Info.plist"
          plutil -lint "$app/PrivacyInfo.xcprivacy"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")" = "com.sebastianspicker.Otherlight"
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Info.plist")" = "0.3.0"
          test "$(plutil -extract CFBundleVersion raw "$app/Info.plist")" = "1"
          if find "$app" -iname '*arrow*' -o -iname '*transitscience*' | grep -q .; then
            echo "Arrow and TransitScience must not be embedded in the mobile app" >&2
            exit 1
          fi
          if rg -q 'OtherlightScience|productName = TransitScience;|productName = Arrow;' apps/apple/Otherlight.xcodeproj/project.pbxproj; then
            echo "The mobile Xcode project must not resolve Arrow-backed TransitScience" >&2
            exit 1
          fi
          if [ -d "$DERIVED_DATA/SourcePackages" ] && find "$DERIVED_DATA/SourcePackages" \( -iname '*arrow*' -o -iname '*otherlightscience*' \) -print -quit | grep -q .; then
            echo "The mobile build resolved a forbidden science dependency" >&2
            exit 1
          fi
