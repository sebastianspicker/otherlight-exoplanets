---
exclude_paths:
  - "docs/audit/**"
  - "coverage/**"
  - "dist/**"
  - "node_modules/**"
  - "services/science/.venv/**"
  - "test-results/**"
  - "apps/apple/AppTests/**"
  - "services/science/benchmarks/**"
  - "**/Tests/**"
  - "**/tests/**"
engines:
  # CI already runs lizard with the repository's own limits (scripts/check-complexity.sh:
  # CCN 12, 100 lines per function). Codacy's lizard thresholds come from the locked default
  # coding standard and only duplicate that gate with stricter numbers, so it is skipped here.
  lizard:
    exclude_paths:
      - "**"
  metric:
    exclude_paths:
      - "pnpm-lock.yaml"
      - "docs/audit/**"
      - "coverage/**"
      - "dist/**"
      - "node_modules/**"
      - "services/science/.venv/**"
      - "test-results/**"
