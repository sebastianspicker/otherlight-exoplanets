<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Otherlight eclipse mark</title>
  <desc id="desc">A starlight ring, the star, partly covered by a dark disc, the transiting world, against deep space.</desc>
  <rect width="96" height="96" fill="#07090d"/>
  <circle cx="41" cy="48" r="30" fill="#f4cf8a" fill-opacity="0.14" stroke="#f4cf8a" stroke-width="3.5"/>
  <circle cx="63" cy="48" r="15" fill="#07090d" stroke="#e9ecf2" stroke-width="3"/>
</svg>
