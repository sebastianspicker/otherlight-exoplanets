[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "otherlight-science-backend"
dynamic = ["version"]
description = "Otherlight's local, fail-closed scientific forward-model service core."
requires-python = ">=3.14.6,<3.15"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
integrator = ["scipy==1.18.0"]
service = ["fastapi==0.139.0", "uvicorn==0.51.0"]
artifacts = ["pyarrow==25.0.0"]
test = [
  "pytest==9.1.1",
  "httpx2==2.7.0",
  "ruff==0.15.20",
  "pyright==1.1.411",
]
dev = [
  "scipy==1.18.0",
  "fastapi==0.139.0",
  "uvicorn==0.51.0",
  "pyarrow==25.0.0",
  "pytest==9.1.1",
  "httpx2==2.7.0",
  "ruff==0.15.20",
  "pyright==1.1.411",
  "build==1.4.0",
]

[tool.hatch.version]
path = "science_backend/__about__.py"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF", "SIM", "C4", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["science_backend"]
