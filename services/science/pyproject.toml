[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "otherlight-science-backend"
dynamic = ["version"]
description = "Otherlight's local, fail-closed scientific forward-model service core."
requires-python = ">=3.14.6,<3.15"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
integrator = ["scipy==1.18.0"]
service = ["fastapi==0.139.0", "uvicorn==0.54.0"]
artifacts = ["pyarrow==25.0.0"]
dev = [
  "scipy==1.18.0",
  "fastapi==0.139.0",
  "uvicorn==0.54.0",
  "pyarrow==25.0.0",
  "build==1.4.0",
]

[tool.hatch.version]
path = "science_backend/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["science_backend"]
